# Opt-in GRPO configuration for the validated stratified-v2 dataset and index.
model_path: "model/Qwen2.5-7B-Instruct"
sft_adapter_path: "AUTO_FROM_SFT_V2"
rl_data_root: "data/rl_train_2000_stratified_v2"
retrieval_root: "data/rl_train_2000_stratified_v2_e5_faiss"
output_root: "outputs/grpo_qwen2.5-7b-v2"
prompt_config_path: "config/prompts.yml"
require_sft_prompt_contract: true

max_samples: 2000
data_sampling_strategy: "proportional_stratified"
data_sampling_seed: 20260826
max_rounds: 4
group_size: 4
num_train_epochs: 1.0
max_steps: 0
max_prompt_length: 2048
max_completion_length: 192
temperature: 0.8
top_p: 0.95
top_k: 5

learning_rate: 0.00001
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
kl_beta: 0.02
clip_epsilon: 0.2
query_global_reward_weight: 0.3333333333333333
evidence_global_reward_weight: 0.42857142857142855
answer_global_reward_weight: 2.3333333333333335
advantage_epsilon: 0.00000001

use_vllm_generation: true
vllm_gpu_indices: "0"
vllm_max_model_len: 4096
vllm_sync_mode: "lora"

retrieval_backend: "e5_faiss"
retrieval_embedding_model: "intfloat/e5-base-v2"
retrieval_device: "cpu"
retrieval_max_length: 512
retrieval_spacy_model: en_core_web_sm
retrieval_top_k: 5
retrieval_max_workers: 4
retrieval_batch_size: 32
use_vectorized_retrieval: true

save_steps: 100
save_total_limit: 3
save_milestone_steps: 1000
logging_steps: 1
gpu_indices: "1"
