# vLLM 可执行文件和模型路径。
vllm_bin: "/data/conda/envs/vllm/bin/vllm"
model_path: "model/Qwen2.5-7B-Instruct"
adapter_path: null
vllm_model: "macorag"

# 每个 base_url 的端口会启动一个服务，GPU 按顺序轮询分配。
gpu_indices: "1"
vllm_base_urls:
  - "http://127.0.0.1:8000/v1"

# 常用性能参数。
dtype: "auto"
gpu_memory_utilization: 0.7
max_model_len: 8192

# 额外 vLLM 参数，按需追加。
extra_args: []
