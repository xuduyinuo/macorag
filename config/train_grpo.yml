# 基础路径
# output_root 是保存根目录；每次 RL 训练会自动写入 output_root/YYYY-MM-DD_HH-MM-SS/。
model_path: "model/Qwen2.5-7B-Instruct"
sft_adapter_path: "outputs/sft_qwen2.5-7b-instruct/2026-07-02_15-07-02/adapter"
rl_data_root: "data/rl_train_2000"
retrieval_root: "data/rl_train_2000_retrieval"
output_root: "outputs/grpo_qwen2.5-7b"

# rollout 与采样
# 这些参数是调参时最常改的行为开关：每个数据集最多样本数、轮数、组大小、步数、生成长度和采样温度。
max_samples: 500
max_rounds: 4
group_size: 4
num_train_epochs: 1.0
max_steps: 0 # 0 表示不限制步数
max_prompt_length: 2048
max_completion_length: 192
temperature: 0.8
top_p: 0.95
top_k: 5

# GRPO 优化
# 保留高频调参项；weight_decay/warmup/精度/量化等低频项使用代码默认值。
learning_rate: 0.00001
gradient_accumulation_steps: 1
kl_beta: 0.02
clip_epsilon: 0.2

# vLLM 生成与权重同步
# trainer 使用 gpu_indices，vLLM server 使用 vllm_gpu_indices，两者不能重叠。
use_vllm_generation: true
vllm_gpu_indices: "0"
vllm_max_model_len: 8192
vllm_sync_mode: "lora"

# 检索环境
# retrieval_embedding_model 必须与 retrieval_root 中已构建索引使用的 embedding 模型一致。
retrieval_embedding_model: "sentence-transformers/all-mpnet-base-v2"
retrieval_spacy_model: en_core_web_sm
retrieval_top_k: 5
retrieval_max_workers: 4
retrieval_batch_size: 32
use_vectorized_retrieval: true

# 日志与检查点
save_steps: 100
logging_steps: 1

# 运行环境
gpu_indices: "1"
