# 基础路径：默认使用已验证的分层训练数据与对应检索索引。
# output_root 是保存根目录；每次 RL 训练会自动写入 output_root/YYYY-MM-DD_HH-MM-SS/。
# 请手动填写要用于 GRPO 初始化的 SFT adapter；启动器不会自动扫描最近模型。
model_path: "model/NousResearch-Meta-Llama-3-8B-Instruct"
sft_adapter_path: "outputs/sft_Meta-Llama-3-8B/2026-09-02_16-33-54/adapter"
rl_data_root: "data/rl_train_2000_stratified_v2"
retrieval_root: "data/rl_train_2000_stratified_v2_e5_faiss"
output_root: "outputs/grpo_Meta-Llama-3-8B"
prompt_config_path: "config/prompts.yml"
require_sft_prompt_contract: true

# rollout 与采样
# 这些参数是调参时最常改的行为开关：每个数据集最多样本数、轮数、组大小、步数、生成长度和采样温度。
max_samples: 1000
max_total_samples: 3000
data_sampling_strategy: "proportional_stratified"
data_sampling_seed: 20260826
max_rounds: 4
group_size: 4
degenerate_bucket_fallback_weight: 0.2
num_train_epochs: 1.0
max_steps: 3000
run_until_step: 200
max_prompt_length: 2048
max_completion_length: 192
temperature: 0.8
top_p: 0.95
top_k: 5

# GRPO 优化
# 保留高频调参项；weight_decay/warmup/精度/量化等低频项使用代码默认值。
learning_rate: 0.00001
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
min_lr_ratio: 0.1
max_grad_norm: 1.0
per_device_train_batch_size: 1 # 动作级前向微批大小；显存允许时可逐步增大
gradient_accumulation_steps: 1
bf16: true
fp16: false
load_4bit: false
attn_implementation: "flash_attention_2"
gradient_checkpointing: true
kl_beta: 0.02
clip_epsilon: 0.2
# G^j_{i,t} = r^j_{i,t} + lambda_j R(tau_i)，主实验按角色与轮次归一化。
query_global_reward_weight: 0.3333333333333333
evidence_global_reward_weight: 0.42857142857142855
answer_global_reward_weight: 2.3333333333333335
answer_local_reward_weight: 1.0 # 对照默认值；消融配置使用 0.0，保留终局奖励与格式惩罚。
advantage_epsilon: 0.000001
advantage_granularity: "role_round"

# vLLM 生成与权重同步
# trainer 使用 gpu_indices，vLLM server 使用 vllm_gpu_indices，两者不能重叠。
use_vllm_generation: true
vllm_gpu_indices: "1"
vllm_gpu_memory_utilization: 0.85
vllm_max_model_len: 4096
vllm_max_num_seqs: 8
vllm_dtype: "bfloat16"
vllm_sync_mode: "lora"
vllm_sync_after_step: true
vllm_sync_every_steps: 1

# 检索环境
# retrieval_embedding_model 必须与 retrieval_root 中已构建索引使用的 embedding 模型一致。
retrieval_backend: "e5_faiss"
retrieval_embedding_model: "intfloat/e5-base-v2"
retrieval_device: "cpu"
retrieval_max_length: 512
retrieval_spacy_model: en_core_web_sm
retrieval_top_k: 5
retrieval_max_workers: 4
retrieval_batch_size: 32
use_vectorized_retrieval: true

# 日志与检查点
save_steps: 200
# 阶段控制器在 200/400/600 以及 1000 步后的每 500 步保存并验证。
save_total_limit: 10
save_milestone_steps: 1000
logging_steps: 1

# 运行环境
gpu_indices: "0"
