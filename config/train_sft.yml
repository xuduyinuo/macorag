# 基础路径
# output_root 是保存根目录；每次 SFT 训练会自动写入 output_root/YYYY-MM-DD_HH-MM-SS/。
model_path: "model/Qwen2.5-3B-Instruct"
data_root: "data/sft/teacher_qwen_plus_trajectory_train"
output_root: "outputs/sft_qwen2.5-3b-instruct"

# 数据与长度
max_length: 6400
max_samples: null

# LoRA 结构
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj

# 训练调参
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3.0
learning_rate: 0.00002
max_steps: 0

# 日志、保存与验证
logging_steps: 1
save_steps: 100
eval_steps: 20
validation_split: true
eval_split_ratio: 0.05
early_stopping_patience: 0

# 运行环境
load_4bit: true
gpu_indices: "1"
