# 两组均使用统一后的 gold-only F1，从同一 SFT 初始化，不复用旧 RL checkpoint。
train_config: config/train_grpo.yml
eval_config: config/eval_grpo_early_fixed.yml
run_dir: outputs/grpo_Meta-Llama-3-8B/answer_local_ablation_200
steps: 200
seed: 42
# 使用独立端口；脚本自行启动/关闭自己创建的服务，不接管已有服务。
server_port: 8002
server_start_timeout: 900
variants:
  aligned_control: 1.0
  no_answer_local: 0.0
