# 单一评估配置：同时供 eval_vllm_server.sh 和 eval_macorag.sh 使用。
# 先启动 vLLM 服务，再启动评估客户端；两个脚本读取同一文件。

# 模型与 vLLM 服务。
# 请手动填写本次要评估的 adapter；启动器不会自动扫描最近模型。
model_path: "model/NousResearch-Meta-Llama-3-8B-Instruct"
adapter_path: "outputs/sft_Meta-Llama-3-8B/2026-09-02_16-33-54/adapter"
vllm_model: "macorag"
vllm_bin: "/data/conda/envs/macorag/bin/vllm"
vllm_gpu_indices: "0"
vllm_base_urls:
  - "http://127.0.0.1:8000/v1"
vllm_dtype: "bfloat16"
vllm_gpu_memory_utilization: 0.85
vllm_max_model_len: 8192
vllm_extra_args:
  - "--disable-log-requests"

# 评估数据与输出。
data_root: "data/eval_1000_stratified_v2"
data_files: []
retrieval_root: "data/eval_1000_stratified_v2_e5_faiss"
output_root: "outputs/eval"
prompt_config_path: "config/prompts.yml"

# 样本与 RAG 轮次。
max_samples: null
max_rounds: 4

# 生成采样参数。
max_prompt_length: 4096
max_completion_length: 256
temperature: 0.2
top_p: 0.95

# 检索参数：retrieval_top_k 控制每次检索返回的段落数量。
retrieval_backend: "e5_faiss"
retrieval_embedding_model: "intfloat/e5-base-v2"
retrieval_device: "cpu"
retrieval_max_length: 512
retrieval_spacy_model: en_core_web_trf
retrieval_top_k: 5
retrieval_max_workers: 4
retrieval_batch_size: 32
use_vectorized_retrieval: true

# 评估并发。
eval_request_workers: 32

# 评估客户端设备；与 vllm_gpu_indices 分开。
gpu_indices: "1"
