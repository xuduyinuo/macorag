# Qwen2.5-7B 专用 SFT 配置。
# 每次训练会保存到 output_root/YYYY-MM-DD_HH-MM-SS/。
model_path: "model/Qwen2.5-7B-Instruct"
data_root: "data/sft/teacher_qwen_plus_trajectory_train_v2"
output_root: "outputs/sft_Qwen2.5-7B"

# 数据与长度
max_length: 6400
max_samples: null
max_samples_by_dataset:
  2wiki: 400
  hotpotqa: 400
  musique: 300
data_sampling_seed: 42
max_rounds: 4
retrieval_top_k: 5
prompt_config_path: "config/prompts.yml"
require_teacher_provenance: true

# LoRA 结构（适用于本地 Qwen2.5 模型）
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj

# 训练调参
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3.0
learning_rate: 0.00002
max_steps: 0
resume_from_checkpoint: null

# 每 200 step 验证；连续 3 次 eval_loss 无明显下降则早停，
# 并在训练结束时恢复验证集表现最好的 checkpoint。
logging_steps: 1
save_steps: 200
save_total_limit: 3
eval_strategy: "steps"
eval_steps: 200
validation_split: true
eval_split_ratio: 0.05
train_test_seed: 777
early_stopping_enabled: true
early_stopping_patience: 3
early_stopping_threshold: 0.001
metric_for_best_model: "eval_loss"
greater_is_better: false
restore_callback_states_from_checkpoint: true

# 与默认 Llama SFT 的 GPU 0 分离；启动前仍需用 nvidia-smi 确认 GPU 1 空闲。
bf16: true
fp16: false
attn_implementation: "flash_attention_2"
load_4bit: true
gpu_indices: "1"
