# Qwen2.5-7B 专用 SFT 配置。
# 每次训练会保存到 output_root/YYYY-MM-DD_HH-MM-SS/。
model_path: "model/Qwen2.5-7B-Instruct"
data_root: "data/sft/teacher_qwen_plus_trajectory_train_v2"
output_root: "outputs/sft_Qwen2.5-7B"

# 数据与长度
max_length: 6400
max_samples: null
# 默认使用全部 3,000 条有效教师轨迹，保持真实 decision 分布。
max_samples_by_dataset: {}
data_sampling_seed: 42
max_rounds: 4
retrieval_top_k: 5
prompt_config_path: "config/prompts.yml"
require_teacher_provenance: true

# LoRA 结构（适用于本地 Qwen2.5 模型）
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj

# 训练调参
per_device_train_batch_size: 1
# 两卡 DDP；1 x 4 x 2 = 8，保持原单卡训练的有效 batch size 不变。
gradient_accumulation_steps: 4
num_train_epochs: 1.0
learning_rate: 0.00002
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
max_grad_norm: 1.0
max_steps: 0
resume_from_checkpoint: null

# 每 200 optimizer step 运行 teacher-forced validation loss；每 400 step
# 追加固定 20 题 smoke。训练结束后只对 eval_loss Top-3 跑严格 100 题验证。
logging_steps: 1
save_steps: 200
# 一轮共约 12 个 checkpoint；训练结束前保留它们，以便按 eval_loss 选 Top-3。
save_total_limit: 20
eval_strategy: "steps"
eval_steps: 200
validation_split: true
eval_split_ratio: 0.05
train_test_seed: 777
early_stopping_enabled: false
early_stopping_patience: 3
early_stopping_threshold: 0.001
metric_for_best_model: "eval_loss"
greater_is_better: false
restore_callback_states_from_checkpoint: true

# 固定协议集来自上面的 held-out validation split，只向模型提供 question；
# Query / Evidence / Answer 全部自由生成，检索走与教师数据同源的 E5-FAISS 索引。
protocol_validation_enabled: true
protocol_validation_size: 100
protocol_validation_seed: 20260910
protocol_smoke_size: 20
protocol_smoke_steps: 400
protocol_candidate_count: 3
protocol_validation_retrieval_backend: "e5_faiss"
protocol_validation_retrieval_root: "data/trajectory_train_e5_faiss"
protocol_validation_embedding_model: "intfloat/e5-base-v2"
protocol_validation_retrieval_device: "cpu"
protocol_validation_retrieval_max_length: 512
protocol_validation_retrieval_batch_size: 32
protocol_validation_max_prompt_length: 4096
protocol_validation_max_completion_length: 256
protocol_validation_temperature: 0.0
protocol_validation_top_p: 1.0
protocol_max_parse_failure_rate: 0.01
protocol_max_missing_answer_tag_rate: 0.002
protocol_min_final_compliance_rate: 0.99

# Qwen SFT 使用两张卡从零开始训练；启动前仍需用 nvidia-smi 确认两卡空闲。
bf16: true
fp16: false
attn_implementation: "flash_attention_2"
load_4bit: true
gradient_checkpointing: true
packing: false
debug_sft: false
debug_sft_num_samples: 10
gpu_indices: "0,1"
