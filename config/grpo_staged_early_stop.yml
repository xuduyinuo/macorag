repo_root: "."
train_config_path: "config/train_grpo.yml"
sft_adapter_path: "outputs/sft_Meta-Llama-3-8B/2026-09-02_16-33-54/adapter"
state_dir: "outputs/grpo_Meta-Llama-3-8B/staged_early_stop"

# 200/400/600 使用 90 条快速验证；1000 步后每 500 步使用完整 300 条。
schedule_steps: [200, 400, 600, 1000, 1500, 2000, 2500, 3000]
validation_profiles:
  early_90:
    steps: [200, 400, 600]
    eval_config_path: "config/eval_grpo_early_fixed.yml"
    expected_per_dataset: 30
    baseline_kind: "sft"
    quality_gate_min_step: 400
  late_300:
    steps: [1000, 1500, 2000, 2500, 3000]
    eval_config_path: "config/eval_grpo_fixed.yml"
    expected_per_dataset: 100
    baseline_kind: "first_stage"
    quality_gate_min_step: 1500
stability_window: 200

# 每个验证层级分别维护 best 与 patience，避免混用 90 条和 300 条指标。
patience: 2
min_delta: 0.005
max_macro_regression: 0.01
max_dataset_regression: 0.02
max_parse_failure_rate: 0.01
max_missing_answer_tag_rate: 0.002
