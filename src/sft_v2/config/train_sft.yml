model_path: model/Qwen2.5-7B-Instruct
train_file: data_v2/teacher_deepseek_v41_flash/train_sft.jsonl
validation_file: data_v2/teacher_deepseek_v41_flash/validation_sft.jsonl
teacher_run_config: data_v2/teacher_deepseek_v41_flash/run_config.json
prompt_config_path: src/sft_v2/policy_prompts.yml
output_root: outputs/sft_v2_Qwen2.5-7B

# The precomputed split is authoritative; never split these trajectories again.
expected_train_trajectories: 1000
# The teacher artifact remains 200 trajectories for provenance. Training uses
# a deterministic trajectory-level subset of 100 selected with seed below.
expected_validation_source_trajectories: 200
validation_trajectory_limit: 100
expected_teacher_prompt_contract_version: sft-v2-unified-wiki18-v2
# Full-data tokenizer preflight observed a maximum of 2,912 tokens.
max_length: 4096

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj

# Current GPU 0 run: 1 x 4 accumulation = effective decision batch size 4.
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 2.0
learning_rate: 0.00002
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 5
eval_steps: 200
save_steps: 200
save_total_limit: 5
seed: 42

bf16: true
fp16: false
load_4bit: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
dataloader_num_workers: 0
gpu_indices: "0"
resume_from_checkpoint: null
