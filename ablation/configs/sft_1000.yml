model_path: "model/Qwen2.5-7B-Instruct"
data_root: "ablation/data/sft_train_1000"
output_root: "ablation/outputs/wo_grpo"
max_length: 6400
max_samples: null
max_samples_by_dataset: {}
data_sampling_seed: 20260905
max_rounds: 4
retrieval_top_k: 5
prompt_config_path: "config/prompts.yml"
# The source provenance is preserved in ablation/data/manifest.json. The copied
# subset intentionally no longer matches the source generator's 1000-per-dataset count.
require_teacher_provenance: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3.0
learning_rate: 0.00002
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.01
max_steps: 0
resume_from_checkpoint: null
logging_steps: 1
save_steps: 200
save_total_limit: 3
eval_strategy: "epoch"
eval_steps: 200
validation_split: false
eval_split_ratio: 0.05
train_test_seed: 777
early_stopping_enabled: false
early_stopping_patience: 3
early_stopping_threshold: 0.001
metric_for_best_model: "eval_loss"
greater_is_better: false
restore_callback_states_from_checkpoint: true
bf16: true
fp16: false
attn_implementation: "flash_attention_2"
load_4bit: true
gpu_indices: "0"
