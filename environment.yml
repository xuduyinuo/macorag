name: macorag
channels:
  - defaults
dependencies:
  - python=3.9
  - pip
  - setuptools
  - wheel
  - pip:
      # Core project and retrieval dependencies.
      - pyarrow==21.0.0
      - python-igraph==0.11.8
      - PyYAML==6.0.3
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.13.1
      - scikit-learn==1.6.1
      - sentence-transformers==5.1.2
      - tqdm==4.68.3
      - httpx==0.28.1
      - openai==2.44.0
      - requests==2.32.5

      # spaCy 3.6.x requires typer<0.10, which conflicts with
      # vllm -> fastapi[standard] -> fastapi-cli -> typer>=0.15.1.
      # spaCy 3.7.5 allows the newer typer line and has Python 3.9 wheels.
      - spacy==3.7.5
      - typer>=0.15.1,<1.0.0
      - https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      # SFT/RL training stack.
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      - transformers==4.57.6
      - tokenizers==0.22.2
      - accelerate==1.10.1
      - datasets==4.5.0
      - peft==0.17.1
      - trl==0.18.2
      - bitsandbytes==0.48.2
      - safetensors==0.7.0
      - einops==0.8.2

      # vLLM LoRA hot-sync server stack.
      - vllm==0.8.5.post1
      - fastapi==0.128.8
      - uvicorn==0.39.0
      - pydantic==2.13.4

      # Development and verification.
      - pytest==8.4.2

# After creating the environment from the repository root, install this
# package itself without re-solving dependencies:
#
#   conda env create -f environment.yml
#   conda activate macorag
#   PIP_NO_BUILD_ISOLATION=1 python -m pip install --no-deps -e .
#   python -m pip check
