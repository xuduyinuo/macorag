[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macorag"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pyarrow>=14",
  "python-igraph>=0.11,<0.12",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
process-datasets = "data_processing.process_datasets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
